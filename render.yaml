services:
  - type: web
    name: weaviate-query-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: WEAVIATE_URL
        sync: false           # set in Render dashboard
      - key: WEAVIATE_API_KEY
        sync: false
      - key: WEAVIATE_COLLECTION
        value: TestingData
      - key: ALLOWED_ORIGINS
        value: "*"            # tighten later
      - key: PYTHON_VERSION
        value: "3.13.0"