services:
  - type: web
    name: weaviate-query-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: WEAVIATE_URL
        sync: false
      - key: WEAVIATE_API_KEY
        sync: false
      - key: WEAVIATE_COLLECTION
        value: TestingData
      - key: API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "http://localhost:3000,http://localhost:8000"
      - key: HUGGINGFACE_API_KEY
        sync: false
